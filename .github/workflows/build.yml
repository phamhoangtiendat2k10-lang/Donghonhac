name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen du an Android
        run: |
          unzip -q ./*.zip -d proj
          if [ -f index.html ]; then cp index.html proj/app/src/main/assets/index.html; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p proj assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dongho-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
